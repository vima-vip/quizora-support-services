{% extends "base.html" %}

{% block title %}QUIZORA · Acceso administrativo{% endblock %}

{% block content %}
<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand-mark" aria-hidden="true">Q</div>

    <p class="eyebrow">Área restringida</p>
    <h1 id="login-title">Acceso administrativo</h1>
    <p class="login-copy">
      Ingresa la contraseña de administración para revisar y validar suscripciones.
    </p>

    {% if error %}
    <p class="login-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" class="login-form">
      <label for="password">Contraseña de administrador</label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        autofocus
      >

      <button type="submit">Ingresar al panel</button>
    </form>
  </section>
</main>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #f5f7fb;
    color: #172033;
    font-family: Arial, sans-serif;
  }

  .login-page {
    display: grid;
    min-height: 100vh;
    padding: 24px;
    place-items: center;
  }

  .login-card {
    width: min(100%, 420px);
    padding: 32px;
    background: #fff;
    border: 1px solid #e3e8f1;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(19, 36, 61, 0.12);
  }

  .brand-mark {
    display: grid;
    width: 46px;
    height: 46px;
    margin-bottom: 24px;
    place-items: center;
    color: #fff;
    background: #075e54;
    border-radius: 12px;
    font-weight: 800;
  }

  .eyebrow {
    margin: 0 0 6px;
    color: #667085;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: 1.65rem;
  }

  .login-copy {
    margin: 12px 0 24px;
    color: #667085;
    line-height: 1.55;
  }

  .login-form {
    display: grid;
    gap: 10px;
  }

  label {
    font-size: 0.9rem;
    font-weight: 700;
  }

  input {
    min-height: 46px;
    padding: 10px 12px;
    border: 1px solid #cdd7e5;
    border-radius: 10px;
    font: inherit;
  }

  input:focus {
    outline: 3px solid rgba(7, 94, 84, 0.18);
    border-color: #075e54;
  }

  button {
    min-height: 46px;
    margin-top: 8px;
    color: #fff;
    background: #075e54;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
  }

  button:hover {
    background: #04473f;
  }

  .login-error {
    margin: 0 0 18px;
    padding: 10px 12px;
    color: #8a1c1c;
    background: #fff0f0;
    border-radius: 10px;
  }
</style>
{% endblock %}
