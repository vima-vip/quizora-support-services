<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suscripción a QUIZORA</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .subscription-card {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.5);
      padding: 24px 24px 28px;
      box-sizing: border-box;
    }

    .card-header {
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.4);
      padding-bottom: 10px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #4b5563;
      margin: 0;
    }

    .card-body {
      display: flex;
      gap: 24px;
      margin-top: 18px;
      align-items: flex-start;
    }

    .qr-section {
      flex: 0 0 260px;
      text-align: center;
    }

    .qr-section img {
      max-width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.35);
    }

    .qr-caption {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
    }

    .form-section {
      flex: 1;
    }

    .form-section-title {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 12px;
    }

    .form-row {
      margin-bottom: 12px;
    }

    .form-row label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }

    .form-row input {
      width: 100%;
      padding: 9px 11px;
      font-size: 13px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      box-sizing: border-box;
      background: #f9fafb;
      color: #111827;
    }

    .form-row input:focus {
      outline: none;
      border-color: #7CFC77;
      box-shadow: 0 0 0 1px #7CFC77;
      background: #ffffff;
    }

    .helper-text {
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }

    .submit-row {
      margin-top: 18px;
      text-align: right;
    }

    .submit-row button {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #111827;
      color: #f9fafb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.3);
    }

    .submit-row button:hover {
      background: #020617;
    }

    @media (max-width: 768px) {
      .subscription-card {
        padding: 20px 16px 24px;
      }

      .card-body {
        flex-direction: column;
      }

      .qr-section {
        flex: none;
        margin-bottom: 16px;
      }

      .submit-row {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="subscription-card">
    <div class="card-header">
      <h1 class="card-title">Suscripción a QUIZORA</h1>
      <p class="card-subtitle">
        Escanea el código QR de Yape para realizar el pago de tu suscripción.
        Luego completa tus datos y el código de operación.
      </p>
    </div>

    <div class="card-body">
      <div class="qr-section">
        <img src="{{ url_for('static', filename='images/yape_qr.png') }}" alt="QR de Yape para suscripción QUIZORA">
        <p class="qr-caption">
          Escanea este código con la app de Yape para pagar tu suscripción.
        </p>
      </div>

      <div class="form-section">
        <p class="form-section-title">Completa tus datos de suscripción</p>

        <form method="post">
          <div class="form-row">
            <label for="nombres">Nombres completos</label>
            <input type="text" id="nombres" name="nombres" required>
          </div>

          <div class="form-row">
            <label for="primer_apellido">Primer apellido</label>
            <input type="text" id="primer_apellido" name="primer_apellido" required>
          </div>

          <div class="form-row">
            <label for="especialidad">Especialidad (código)</label>
            <input type="text" id="especialidad" name="especialidad" required>
            <p class="helper-text">Ejemplos: adm, ele, eco, enf…</p>
          </div>

          <div class="form-row">
            <label for="dni">Número de DNI</label>
            <input type="text" id="dni" name="dni" required>
          </div>

          <div class="form-row">
            <label for="codigo_transaccion_yape">Código de operación Yape</label>
            <input type="text" id="codigo_transaccion_yape" name="codigo_transaccion_yape" required>
          </div>

          <div class="submit-row">
            <button type="submit">Enviar solicitud</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
