<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de soporte QUIZORA</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .widget-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.4);
      overflow: hidden;
    }

    .widget-header {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .widget-header-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f9fafb;
      font-weight: 700;
      font-size: 14px;
    }

    .widget-header-text {
      font-size: 13px;
      color: #111827;
      font-weight: 600;
    }

    .chat-area {
      padding: 10px 12px;
      background: #f9fafb;
    }

    textarea {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      padding: 8px;
      font-size: 13px;
      resize: none;
      box-sizing: border-box;
      background: #ffffff;
      color: #111827;
    }

    textarea:focus {
      outline: none;
      border-color: #7CFC77;
      box-shadow: 0 0 0 1px #7CFC77;
    }

    .payment-link-wrapper {
      margin-top: 10px;
      text-align: center;
    }

    .payment-link-text {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .payment-link-btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #7CFC77;     /* verde suave */
      color: #111827;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(124, 252, 119, 0.35);
    }

    .payment-link-btn:hover {
      background: #A0FF9A;
    }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.4);
      background: #ffffff;
    }

    .input-row input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 13px;
      box-sizing: border-box;
    }

    .input-row input[type="text"]:focus {
      outline: none;
      border-color: #7CFC77;
      box-shadow: 0 0 0 1px #7CFC77;
    }

    .input-row button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #111827;
      color: #f9fafb;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .input-row button:hover {
      background: #020617;
    }

    @media (max-width: 480px) {
      .widget-card {
        max-width: 100%;
      }

      textarea {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="widget-card">
    <div class="widget-header">
      <div class="widget-header-logo">Q</div>
      <div class="widget-header-text">Asistente de soporte QUIZORA</div>
    </div>

    <div class="chat-area">
      <!-- Aquí pintas el historial del chat (como antes) -->
      <textarea readonly>
{{ historial_chat }}
      </textarea>

      <!-- Bloque del link de pago, siempre visible y clicable en PC y móvil -->
      <div class="payment-link-wrapper">
        <p class="payment-link-text">
          ¿Listo para adquirir tu suscripción? Completa el formulario de pago aquí:
        </p>
        <a href="{{ url_for('form_suscripcion') }}" class="payment-link-btn" target="_blank">
          Ir al formulario de suscripción
        </a>
      </div>
    </div>

    <form method="post">
      <div class="input-row">
        <input type="text" name="mensaje" placeholder="Escribe tu consulta..." required>
        <button type="submit">Enviar</button>
      </div>
    </form>
  </div>
</body>
</html>
